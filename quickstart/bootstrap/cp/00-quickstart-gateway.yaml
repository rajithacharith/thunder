# Quickstart-only: registers the quickstart pack's own data plane as a gateway this control
# plane administers, so the two come up already wired together with no manual registration step.
#
# Named to sort before 01-default-resources.yaml (bootstrap applies files in lexical order): a
# resource that default-resources creates with a client secret or similar — the CONSOLE
# application itself, for one — has its value captured to whichever gateway is the default *at
# the moment it is written*, once only, never retroactively. Registering the gateway after would
# leave that value permanently uncaptured, and every later auto-apply would refuse forever with
# "the gateway does not hold every value this version refers to", never saying which one or why.
#
# The key is a fixed, dev-only value that exists nowhere else: the quickstart data plane's
# deployment.yaml carries its SHA-256 digest as server.security.management_api_key_hash (patched
# in at package time, never into the checked-in source file). Never reuse this key outside the
# quickstart pack.
#
# caCertificate is resolved from the DP_CA_CERTIFICATE environment variable that
# start-quickstart.sh exports before running this bootstrap, set to the data plane's own
# freshly-generated certificate (real newlines escaped to literal \n so this stays valid YAML;
# the YAML parser turns them back into real newlines once this file is templated and decoded).
resource_type: gateway
name: "dp"
baseUrl: "https://localhost:8090"
key: "7d9c7f5adadaef3f965cd483ffb0aa4c9993486c3674a1fa1d0a5bf21e32fe46"
caCertificate: "{{.DP_CA_CERTIFICATE}}"
