<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker></defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="600" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">ThunderID quickstart pack: architecture</text>
<rect x="450" y="48" width="300" height="58" rx="8" fill="#f6f8fa" stroke="#c9d1d9"/><text x="600.0" y="74.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Operators (browser)</text><text x="600.0" y="91.0" text-anchor="middle" font-size="11" fill="#57606a">Two accounts: admin, Service Desk Admin</text>
<rect x="40" y="165" width="320" height="395" rx="14" fill="#f1f7ff" stroke="#0969da" stroke-width="2"/><text x="60" y="193" font-size="17" font-weight="700" fill="#0969da">auth-dp</text><text x="340" y="193" text-anchor="end" font-size="13" font-weight="600" fill="#0969da">:8091</text><text x="60" y="212" font-size="11.5" fill="#57606a">Sign-in only. Authenticates Control Plane operators.</text>
<rect x="440" y="165" width="320" height="395" rx="14" fill="#fff6ef" stroke="#c4540a" stroke-width="2"/><text x="460" y="193" font-size="17" font-weight="700" fill="#c4540a">cp (Control Plane)</text><text x="740" y="193" text-anchor="end" font-size="13" font-weight="600" fill="#c4540a">:8095</text><text x="460" y="212" font-size="11.5" fill="#57606a">Administers the Data Plane. Serves no runtime traffic.</text>
<rect x="840" y="165" width="320" height="395" rx="14" fill="#f0faf3" stroke="#1a7f37" stroke-width="2"/><text x="860" y="193" font-size="17" font-weight="700" fill="#1a7f37">dp (managed Data Plane)</text><text x="1140" y="193" text-anchor="end" font-size="13" font-weight="600" fill="#1a7f37">:8090</text><text x="860" y="212" font-size="11.5" fill="#57606a">Runtime auth. Receives what the Control Plane pushes.</text>
<rect x="60" y="230" width="280" height="52" rx="8" fill="#ffffff" stroke="#0969da"/><text x="200.0" y="253.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">OAuth2 / OIDC</text><text x="200.0" y="270.0" text-anchor="middle" font-size="11" fill="#57606a">authorize, token, JWKS</text>
<rect x="60" y="294" width="280" height="52" rx="8" fill="#ffffff" stroke="#0969da"/><text x="200.0" y="317.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Gate (sign-in UI)</text><text x="200.0" y="334.0" text-anchor="middle" font-size="11" fill="#57606a">flow engine runs the login flow</text>
<rect x="60" y="358" width="280" height="52" rx="8" fill="#ffffff" stroke="#0969da"/><text x="200.0" y="381.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Application: CP_CONSOLE</text><text x="200.0" y="398.0" text-anchor="middle" font-size="11" fill="#57606a">public PKCE client, CP console redirect URI</text>
<rect x="60" y="422" width="280" height="52" rx="8" fill="#ffffff" stroke="#0969da"/><text x="200.0" y="445.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Operator accounts</text><text x="200.0" y="462.0" text-anchor="middle" font-size="11" fill="#57606a">admin (signs into the CP console)</text>
<rect x="60" y="486" width="280" height="52" rx="8" fill="#f6f8fa" stroke="#c9d1d9"/><text x="200.0" y="509.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">No console UI</text><text x="200.0" y="526.0" text-anchor="middle" font-size="11" fill="#57606a">apps/console removed, CONSOLE app stripped</text>
<rect x="460" y="230" width="280" height="52" rx="8" fill="#ffffff" stroke="#c4540a"/><text x="600.0" y="253.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Console UI (/console)</text><text x="600.0" y="270.0" text-anchor="middle" font-size="11" fill="#57606a">trusted_issuer = auth-dp, client CP_CONSOLE</text>
<rect x="460" y="294" width="280" height="52" rx="8" fill="#ffffff" stroke="#c4540a"/><text x="600.0" y="317.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Management APIs</text><text x="600.0" y="334.0" text-anchor="middle" font-size="11" fill="#57606a">users, applications, roles, flows, ...</text>
<rect x="460" y="358" width="280" height="52" rx="8" fill="#ffffff" stroke="#c4540a"/><text x="600.0" y="381.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Value capture</text><text x="600.0" y="398.0" text-anchor="middle" font-size="11" fill="#57606a">password / client ID written to dp's stores</text>
<rect x="460" y="422" width="280" height="52" rx="8" fill="#ffffff" stroke="#c4540a"/><text x="600.0" y="445.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Auto-apply (gateway.auto_apply)</text><text x="600.0" y="462.0" text-anchor="middle" font-size="11" fill="#57606a">capture version, preview, apply</text>
<rect x="460" y="486" width="280" height="52" rx="8" fill="#ffffff" stroke="#c4540a"/><text x="600.0" y="509.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Gateway registry</text><text x="600.0" y="526.0" text-anchor="middle" font-size="11" fill="#57606a">dp: base URL, API key, CA certificate</text>
<rect x="860" y="230" width="280" height="52" rx="8" fill="#ffffff" stroke="#1a7f37"/><text x="1000.0" y="253.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Admin Console (/console)</text><text x="1000.0" y="270.0" text-anchor="middle" font-size="11" fill="#57606a">Users, Agents, Groups, Roles; client ADMIN_CONSOLE</text>
<rect x="860" y="294" width="280" height="52" rx="8" fill="#ffffff" stroke="#1a7f37"/><text x="1000.0" y="317.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Gate + OAuth2 / OIDC</text><text x="1000.0" y="334.0" text-anchor="middle" font-size="11" fill="#57606a">Acrylic Orange theme, Centered layout</text>
<rect x="860" y="358" width="280" height="52" rx="8" fill="#ffffff" stroke="#1a7f37"/><text x="1000.0" y="381.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Runtime APIs</text><text x="1000.0" y="398.0" text-anchor="middle" font-size="11" fill="#57606a">users, groups, roles, agents</text>
<rect x="860" y="422" width="280" height="52" rx="8" fill="#ffffff" stroke="#1a7f37"/><text x="1000.0" y="445.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Management API (API key)</text><text x="1000.0" y="462.0" text-anchor="middle" font-size="11" fill="#57606a">/import, /variables, /secrets</text>
<rect x="860" y="486" width="280" height="52" rx="8" fill="#ffffff" stroke="#1a7f37"/><text x="1000.0" y="509.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Local state (SQLite)</text><text x="1000.0" y="526.0" text-anchor="middle" font-size="11" fill="#57606a">synced resources + local identity data</text>
<path d="M560,106 V230" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#a)"/>
<text x="572" y="140" text-anchor="start" font-size="11.5" font-weight="600" fill="#1f2328">1  open /console</text>
<path d="M460,248 H340" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a)"/>
<text x="400" y="240" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0969da">2  sign in</text>
<text x="400" y="229" text-anchor="middle" font-size="10.5" font-weight="500" fill="#0969da">(OIDC, PKCE)</text>
<path d="M340,268 H460" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text x="400" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0969da">3  token</text>
<path d="M740,448 H860" fill="none" stroke="#c4540a" stroke-width="2" marker-end="url(#a)"/>
<text x="800" y="416" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c4540a">4  sync</text>
<text x="800" y="430" text-anchor="middle" font-size="10.5" font-weight="500" fill="#c4540a">POST /import</text>
<path d="M740,384 H860" fill="none" stroke="#c4540a" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/>
<text x="800" y="332" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c4540a">4  values</text>
<text x="800" y="344" text-anchor="middle" font-size="10.5" font-weight="500" fill="#c4540a">PUT /secrets,</text>
<text x="800" y="356" text-anchor="middle" font-size="10.5" font-weight="500" fill="#c4540a">/variables</text>
<path d="M750,77 H1000 V230" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a)"/>
<text x="880" y="69" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1a7f37">5  open /console (ADMIN_CONSOLE)</text>
<rect x="40" y="585" width="1120" height="192" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="60" y="612" text-anchor="start" font-size="14" font-weight="700" fill="#1f2328">Shared by setup.sh and start.sh</text>
<text x="60" y="638" text-anchor="start" font-size="12" font-weight="500" fill="#1f2328">One generated TLS certificate, JWT signing keys and crypto key: created by auth-dp, copied to dp and cp, so a token auth-dp issues verifies on cp.</text>
<text x="60" y="656" text-anchor="start" font-size="12" font-weight="500" fill="#1f2328">Two accounts, asked for once: admin (on auth-dp, signs into the CP console) and Service Desk Admin (authored on cp, synced to dp).</text>
<text x="60" y="674" text-anchor="start" font-size="12" font-weight="500" fill="#1f2328">Each plane has its own SQLite databases, and bootstrap resources layered on at package time:</text>
<text x="84" y="692" text-anchor="start" font-size="12" font-weight="500" fill="#57606a">auth-dp: CP_CONSOLE application, CORS allowlist</text>
<text x="84" y="710" text-anchor="start" font-size="12" font-weight="500" fill="#57606a">dp: ADMIN_CONSOLE application</text>
<text x="84" y="728" text-anchor="start" font-size="12" font-weight="500" fill="#57606a">cp: gateway “dp”, ADMIN_CONSOLE application</text>
<text x="60" y="746" text-anchor="start" font-size="12" font-weight="500" fill="#1f2328">The default CONSOLE application is stripped from all three. Packaged by build.sh (package_quickstart), set up by setup.sh, started by start.sh.</text>
<text x="60" y="764" text-anchor="start" font-size="12" font-weight="500" fill="#1f2328">A write on the CP (create user, change password, edit application, ...) is captured and applied to dp within seconds.</text>
</svg>